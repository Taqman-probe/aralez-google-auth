[package]
name = "aralez-google-auth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
aralez-spec = { git = "https://github.com/Taqman-probe/aralez.git", branch = "feature/customizable2" }
aralez-util = { git = "https://github.com/Taqman-probe/aralez.git", branch = "feature/customizable2" }
aralez-plugin-google-auth = { path = "crates/aralez-plugin-google-auth" }

async-trait = "0.1.89"
axum = { version = "0.8.9" }
base64 = "0.22.1"
bytes = "1.12.1"
inventory = "0.3.24"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
log = "0.4.33"
noyalib = { version = "0.0.15", features = ["compat-serde-yaml"] }
pingora = "0.8.1"
pingora-core = "0.8.1"
pingora-http = "0.8.1"
pingora-proxy = "0.8.1"
rand = "0.10.2"
sha2 = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
urlencoding = "2.1.3"
